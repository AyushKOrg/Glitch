<!doctype html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5fb">
<title>Glitch</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>try{var d=document.documentElement,t=localStorage.getItem('glitch_theme'),s=localStorage.getItem('glitch_scheme');if(t)d.dataset.theme=t;if(s)d.dataset.scheme=s}catch(e){}</script>
<style>
:root{--bg:#f6f5fb;--panel:#fff;--panel-alt:#f2f1f9;--border:#e7e5f2;--border-strong:#d8d5ea;--text:#1a1b1f;--text-dim:#6b6f76;--muted:#9a9da3;--error:#e0334a;--error-soft:#fde8ec;--on-accent:#fff;--ease:cubic-bezier(.34,1.56,.64,1)}
html[data-scheme=dark]{--bg:#0f0f14;--panel:#17171f;--panel-alt:#1e1e28;--border:#2a2a37;--border-strong:#3a3a4a;--text:#ececf1;--text-dim:#a0a3ad;--muted:#6f7280;--error-soft:#3a1820;color-scheme:dark}
@media(prefers-color-scheme:dark){html:not([data-scheme=light]){--bg:#0f0f14;--panel:#17171f;--panel-alt:#1e1e28;--border:#2a2a37;--border-strong:#3a3a4a;--text:#ececf1;--text-dim:#a0a3ad;--muted:#6f7280;--error-soft:#3a1820;color-scheme:dark}}
[data-theme=default]{--accent:#7c3aed;--accent-2:#ec4899;--accent-soft:#f2ebff;--accent-strong:#6425c7}
[data-theme=matrix]{--accent:#10b981;--accent-2:#06b6d4;--accent-soft:#e3fbf3;--accent-strong:#0a9468}
[data-theme=sunset]{--accent:#f97316;--accent-2:#ef4444;--accent-soft:#fff0e6;--accent-strong:#d95c0d}
[data-theme=ice]{--accent:#3b82f6;--accent-2:#06b6d4;--accent-soft:#e8f2ff;--accent-strong:#2266d6}
*{box-sizing:border-box;--grad:linear-gradient(135deg,var(--accent),var(--accent-2))}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{white-space:nowrap}
::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes shift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes blob{0%,100%{transform:none}50%{transform:translate(4%,6%) scale(1.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes dots{0%,60%,100%{transform:none;opacity:.6}30%{transform:translateY(-5px) scale(1.15);opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
.layout{display:flex;height:100%}
/* sidebar */
.side{width:268px;flex:none;background:var(--panel-alt);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 10px;gap:2px;transition:transform .25s ease}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px}
.side-brand img{width:32px;height:32px;border-radius:9px;animation:rise .5s var(--ease) both}
.side-brand strong{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;background:var(--grad);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 6s ease infinite}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;color:var(--text);text-align:left;cursor:pointer;transition:background .15s,transform .15s var(--ease)}
.nav:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}.nav:active{transform:scale(.98)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav.primary{background:var(--panel);border:1px solid var(--border);font-weight:600}
.nav[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
html[data-scheme=dark] .nav[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text)}
.nav.off{opacity:.5}
#newdot{display:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:auto}
.side h4{margin:18px 10px 6px;font-size:.74rem;font-weight:600;color:var(--muted)}
.swatches{display:flex;gap:.6rem;padding:2px 10px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;position:relative;animation:bob 3.6s ease-in-out infinite;transition:transform .2s var(--ease)}
.swatch:nth-child(2){animation-delay:.15s}.swatch:nth-child(3){animation-delay:.3s}.swatch:nth-child(4){animation-delay:.45s}
.swatch[data-theme=default]{background:linear-gradient(135deg,#7c3aed,#ec4899)}.swatch[data-theme=matrix]{background:linear-gradient(135deg,#10b981,#06b6d4)}
.swatch[data-theme=sunset]{background:linear-gradient(135deg,#f97316,#ef4444)}.swatch[data-theme=ice]{background:linear-gradient(135deg,#3b82f6,#06b6d4)}
.swatch:hover{transform:scale(1.15) rotate(-6deg)!important;animation-play-state:paused}
.swatch.active{border-color:var(--text);animation-play-state:paused}
.swatch.active::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--border-strong)}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--border);margin:6px -10px -12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);background-size:200% 200%;color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;animation:shift 6s ease infinite}
.me-text{min-width:0;flex:1;line-height:1.25}
#who{display:block;font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-sub{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--text-dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot.on{background:#16a34a;animation:pulse 2.2s ease-out infinite}
.mini{border:1px solid var(--border);background:var(--panel);color:var(--text-dim);border-radius:8px;padding:5px 9px;font-size:.76rem;cursor:pointer;transition:transform .15s var(--ease),color .15s}
.mini:hover{color:var(--text);transform:translateY(-2px)}
/* stage */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--panel)}
.topbar{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.topbar img{width:26px;height:26px;border-radius:7px}
#log{flex:1;overflow-y:auto;padding:1.5rem 1.4rem;display:flex;flex-direction:column;gap:1.1rem;width:min(780px,100%);margin:0 auto}
.msg{position:relative;max-width:min(640px,92%);padding:.65rem .95rem;border-radius:16px;line-height:1.55;font-size:.94rem;white-space:pre-wrap;word-break:break-word;animation:msgin .32s var(--ease)}
.msg.user{align-self:flex-end;background:var(--grad);color:var(--on-accent);border-bottom-right-radius:4px;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
.msg.bot{align-self:flex-start;background:var(--panel-alt);margin-left:38px;border-bottom-left-radius:4px}
.msg.bot::before{content:"";position:absolute;left:-38px;bottom:0;width:28px;height:28px;border-radius:50%;background:url(/logo.png) center/cover;box-shadow:0 0 0 1px var(--border)}
.msg.err{align-self:center;color:var(--error);background:var(--error-soft);border-radius:999px;font-size:.8rem;padding:.4rem .9rem;animation:msgin .35s var(--ease),shake .5s ease .35s}
.msg .tag{display:block;margin-top:6px;font-size:.74rem;opacity:.7}
.dl-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;white-space:normal}
.dl{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 25%,transparent);background:color-mix(in srgb,currentColor 8%,transparent);color:inherit;font-size:.78rem;cursor:pointer;transition:transform .15s var(--ease),background .15s}
.dl span{overflow:hidden;text-overflow:ellipsis}.dl:hover{transform:translateY(-2px);background:color-mix(in srgb,currentColor 16%,transparent)}
.chip.uploading .n::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;vertical-align:-1px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.typing{display:inline-flex;gap:4px;padding:.3rem 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--grad);animation:dots 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.hero{display:none;text-align:center;font-size:clamp(1.5rem,3.4vw,2rem);font-weight:600;letter-spacing:-.02em;margin:0 0 1.4rem;animation:rise .5s var(--ease) both}
.hero b{background:var(--grad);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 6s ease infinite}
#chips{display:none;flex-wrap:wrap;gap:6px;width:min(780px,100%);margin:0 auto;padding:0 1.4rem 8px}#chips.has{display:flex}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:999px;font-size:.78rem;color:var(--text-dim);background:var(--panel-alt);animation:msgin .3s var(--ease)}
.chip .n{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--text)}.chip button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0}.chip.uploading{opacity:.6}
#chat{display:flex;align-items:flex-end;gap:6px;width:min(780px,calc(100% - 2.8rem));margin:0 auto 1.1rem;padding:6px 6px 6px 8px;background:var(--panel-alt);border:1px solid var(--border);border-radius:26px;transition:border-color .15s,box-shadow .15s,background .15s}
#chat:focus-within{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
#input{flex:1;resize:none;max-height:140px;border:0;outline:0;background:none;padding:9px 4px;line-height:1.5}#input::placeholder{color:var(--muted)}
.round{width:38px;height:38px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden}
#attach{background:none;color:var(--text-dim);transition:background .15s,transform .2s var(--ease)}#attach:hover{background:var(--border);transform:rotate(90deg)}
#send{background:var(--grad);background-size:200% 200%;color:var(--on-accent);box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 60%,transparent);transition:transform .15s var(--ease),filter .15s}
#send:hover:not(:disabled){transform:translateY(-2px) scale(1.06);filter:brightness(1.08)}#send:active:not(:disabled){transform:scale(.94)}#send:disabled{opacity:.45;cursor:wait}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .55s ease-out;pointer-events:none}
.suggest{display:none;flex-direction:column;width:min(780px,calc(100% - 2.8rem));margin:.6rem auto 0}
.suggest button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:.7rem .9rem;text-align:left;color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s,transform .15s var(--ease)}
.suggest button:hover{background:var(--panel-alt);color:var(--text);transform:translateX(4px)}
.suggest svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.empty .stage{justify-content:center;padding-bottom:6vh}body.empty #log{display:none}body.empty .hero{display:block}body.empty #chat{margin-bottom:0}body.empty .suggest{display:flex}
body.dragging::after{content:'Drop files to attach';position:fixed;inset:12px;z-index:30;display:flex;align-items:center;justify-content:center;border:2px dashed var(--accent);border-radius:18px;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--accent);font-size:1.1rem;pointer-events:none}
/* overlays: files + sign-in */
.overlay{position:fixed;inset:0;background:rgba(10,10,20,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.overlay.open{display:flex}
.box,#gate form{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 50px -20px rgba(20,20,30,.3);animation:msgin .4s var(--ease)}
.box{width:min(560px,100%);max-height:80vh;display:flex;flex-direction:column}
.box .top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
#fileList{overflow-y:auto;padding:6px 16px 12px}#fileList h3{margin:14px 0 2px;font-size:.78rem;font-weight:600;color:var(--muted)}
.frow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}.fn{flex:1;min-width:0;word-break:break-all;font-size:.85rem}.fm{color:var(--muted);font-size:.74rem}.none{color:var(--muted);font-size:.82rem;padding:8px 0}
#gate{background:var(--bg);backdrop-filter:none;overflow:hidden;z-index:50}
#gate::before,#gate::after{content:"";position:absolute;width:46vw;height:46vw;max-width:520px;max-height:520px;border-radius:50%;filter:blur(70px);opacity:.35;background:var(--grad);animation:blob 14s ease-in-out infinite}
#gate::before{top:-12%;left:-10%}#gate::after{bottom:-14%;right:-8%;animation-delay:-7s;animation-direction:reverse}
#gate form{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;width:min(400px,100%);padding:2rem}
#gate form>*{animation:rise .5s var(--ease) both}#gate form>:nth-child(2){animation-delay:.06s}#gate form>:nth-child(3){animation-delay:.1s}#gate form>:nth-child(4){animation-delay:.14s}#gate form>:nth-child(5){animation-delay:.18s}
.brand{display:flex;align-items:center;gap:.7rem}.brand img{width:40px;height:40px;border-radius:11px;animation:rise .6s var(--ease)}.brand strong{font-size:1.4rem;font-weight:800;background:var(--grad);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 6s ease infinite}
#gate p{margin:0;color:var(--text-dim);font-size:.88rem}
#gate input{background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;padding:.65rem .8rem;outline:0;transition:border-color .15s,box-shadow .15s}#gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tabs{display:flex;gap:6px}.tabs button{flex:1;background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:10px;padding:8px;cursor:pointer;transition:all .15s}.tabs button[aria-pressed=true]{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
html[data-scheme=dark] .tabs button[aria-pressed=true]{color:var(--text)}
.msgline{min-height:1.2em;font-size:.8rem;color:var(--error)}.msgline.good{color:#16a34a}
.cta{border:0;border-radius:10px;padding:.75rem;font-weight:600;color:var(--on-accent);background:var(--grad);background-size:200% 200%;cursor:pointer;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 55%,transparent);transition:transform .15s var(--ease),filter .15s}
.cta:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}.cta:disabled{opacity:.6}
#log::-webkit-scrollbar{width:8px}#log::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
@media(max-width:760px){
 .side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);width:min(290px,86vw)}
 body.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(10,10,20,.45)}
 .topbar{display:flex}.msg{max-width:88%}
}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="empty">
<div class="layout">
<aside class="side" id="side">
  <div class="side-brand"><img src="/logo.png" alt=""><strong>Glitch</strong></div>
  <button class="nav primary" id="clear" type="button"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>New chat</button>
  <button class="nav" id="filesBtn" type="button"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Files<span id="newdot"></span></button>
  <h4>Mode</h4>
  <div class="modes" role="group" aria-label="Mode">
    <button class="nav" type="button" data-mode="flash" aria-pressed="true" title="Fast and light; can also look at images and PDFs"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Flash</button>
    <button class="nav" type="button" data-mode="cognition" aria-pressed="false" title="Deeper reasoning and code (text only)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 8h4M12 16H8"/></svg>Cognition</button>
  </div>
  <h4>Accent</h4>
  <div class="swatches" id="swatches">
    <button type="button" class="swatch" data-theme="default" title="Violet" aria-label="Violet"></button>
    <button type="button" class="swatch" data-theme="matrix" title="Teal" aria-label="Teal"></button>
    <button type="button" class="swatch" data-theme="sunset" title="Coral" aria-label="Coral"></button>
    <button type="button" class="swatch" data-theme="ice" title="Blue" aria-label="Blue"></button>
  </div>
  <button class="nav" id="scheme" type="button" style="margin-top:10px"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>Light / dark</button>
  <div class="spacer"></div>
  <div class="me">
    <div class="avatar" id="avatar">G</div>
    <div class="me-text"><span id="who">Signed out</span><span class="me-sub"><span id="dot" class="dot"></span>Glitch</span></div>
    <button class="mini" id="signout" type="button">Sign out</button>
  </div>
</aside>

<div class="stage">
  <div class="topbar"><button class="mini" id="menu" type="button" aria-label="Menu">Menu</button><img src="/logo.png" alt=""><strong>Glitch</strong></div>
  <main id="log" aria-live="polite"></main>
  <h2 class="hero">Ready when <b>you are.</b></h2>
  <div id="chips"></div>
  <form id="chat">
    <button class="round" id="attach" type="button" title="Attach files (PDF, Word, text, code, images; up to 25 MB each)" aria-label="Attach files"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <input type="file" id="fileInput" multiple hidden>
    <textarea id="input" rows="1" placeholder="Ask Glitch" autocomplete="off"></textarea>
    <button class="round" id="send" type="submit" title="Send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
  </form>
  <div class="suggest">
    <button type="button" data-prompt="Help me write or edit: "><svg viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Write or edit</button>
    <button type="button" data-attach><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/></svg>Summarise a file</button>
    <button type="button" data-prompt="Search the web for "><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>Search the web</button>
  </div>
</div>
</div>

<div id="files" class="overlay" role="dialog" aria-label="Files">
  <div class="box"><div class="top"><strong>Your files</strong><button class="mini" id="filesClose" type="button">Close</button></div><div id="fileList"></div></div>
</div>

<div id="gate" class="overlay">
  <form id="gateForm">
    <div class="brand"><img src="/logo.png" alt=""><strong>Glitch</strong></div>
    <div class="tabs" role="group" aria-label="Account">
      <button type="button" data-tab="login" aria-pressed="true">Sign in</button>
      <button type="button" data-tab="register" aria-pressed="false">Create account</button>
    </div>
    <p id="gateHint">Prove you're allowed to bother me.</p>
    <input id="email" type="email" autocomplete="username" placeholder="Email" autocapitalize="none" spellcheck="false" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <div class="msgline" id="gateMsg"></div>
    <button class="cta" id="gateSubmit" type="submit">Sign in</button>
  </form>
</div>

<script src="/vendor/supabase.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), sendBtn = $('send');
  const BUCKET = 'glitch-files';
  const MAX_UPLOAD = 25 * 1024 * 1024;                          // matches the bucket limit in supabase.sql
  const ALLOWED = new Set(['.txt','.md','.py','.js','.ts','.tsx','.jsx','.json','.csv','.html','.css','.java','.c','.cpp',
    '.h','.cs','.go','.rs','.sql','.yaml','.yml','.xml','.log','.ini','.toml','.sh','.bat','.pdf','.docx','.png','.jpg','.jpeg','.gif','.webp']);
  const MODES = ['flash', 'cognition'];
  const MODE_KEY = 'glitch_mode';

  let mode = 'flash';
  try { const m = localStorage.getItem(MODE_KEY); if (MODES.includes(m)) mode = m; } catch {}
  let user = null;                                              // {id, email} when signed in
  let history = [];                                             // [{role, content, attachments?, tag?}]
  let busy = false;
  let sb = null;
  const pending = [];                                           // attachments waiting to be sent

  const histKey = () => 'glitch_history_' + (user ? user.id : 'anon') + '_' + mode;
  const seenKey = () => 'glitch_files_seen_' + (user ? user.id : 'anon');
  const fmtSize = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
  const niceName = (n) => n.replace(/^[a-z0-9]{6,9}-/, '');     // drop the upload id prefix for display

  // ---- chat history (kept in this browser, per account and mode) ----------------
  function saveHistory() { try { localStorage.setItem(histKey(), JSON.stringify(history.slice(-40))); } catch {} }
  function loadHistory() {
    history = [];
    try {
      const h = JSON.parse(localStorage.getItem(histKey()) || '[]');
      if (Array.isArray(h)) history = h.filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string');
    } catch {}
  }

  function add(role, text, tag, links) {
    const el = document.createElement('div');
    document.body.classList.remove('empty');
    el.className = 'msg ' + role;
    el.textContent = text;                                      // textContent: model output is never parsed as HTML
    if (tag) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag; el.appendChild(t); }
    if (links && links.length) {
      const row = document.createElement('div'); row.className = 'dl-row';
      links.forEach((l) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'dl'; b.title = 'Download ' + l.label;
        b.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';
        const t = document.createElement('span'); t.textContent = l.label; b.appendChild(t);
        b.addEventListener('click', () => downloadFile({ path: l.path, name: l.path.split('/').pop() }));
        row.appendChild(b);
      });
      el.appendChild(row);
    }
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function render() {
    log.textContent = '';
    document.body.classList.toggle('empty', !history.length);
    if (!history.length) return;
    history.forEach(m => {
      const links = user ? (m.attachments || []).map(a => ({ path: a.path, label: a.name }))
        .concat((m.made || []).map(n => ({ path: user.id + '/generated/' + n, label: n }))) : [];
      add(m.role === 'user' ? 'user' : 'bot', m.content, '', links);
    });
  }

  // ---- talking to the server ------------------------------------------------
  async function api(path, opts = {}) {
    const { data } = await sb.auth.getSession();
    const token = data.session ? data.session.access_token : '';
    const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
    let body = {}; try { body = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data: body };
  }

  // ---- sign in / sign up ------------------------------------------------------
  let tab = 'login';
  const gateMsg = (text, good) => { $('gateMsg').textContent = text || ''; $('gateMsg').classList.toggle('good', !!good); };
  function openGate(text) { gateMsg(text); $('gate').classList.add('open'); $('email').focus(); }
  function setTab(t) {
    tab = t;
    document.querySelectorAll('#gate .tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === t)));
    $('password').autocomplete = t === 'register' ? 'new-password' : 'current-password';
    $('gateSubmit').textContent = t === 'register' ? 'Create account' : 'Sign in';
    $('gateHint').textContent = t === 'register' ? 'Use a real email. Password: 8 characters or more.' : "Prove you're allowed to bother me.";
    gateMsg('');
  }
  document.querySelectorAll('#gate .tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

  $('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    if (!sb) return;
    if (tab === 'register' && password.length < 8) return gateMsg('Password must be at least 8 characters.');
    $('gateSubmit').disabled = true; gateMsg('');
    try {
      if (tab === 'register') {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (!data.session) { setTab('login'); gateMsg('Check your email to confirm the account, then sign in.', true); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
      $('password').value = '';
    } catch (err) {
      gateMsg(err.message || 'Something went wrong.');
    } finally {
      $('gateSubmit').disabled = false;
    }
  });

  function onSignedIn(u) {
    user = { id: u.id, email: u.email || '' };
    $('who').textContent = user.email; $('avatar').textContent = (user.email[0] || 'G').toUpperCase(); $('dot').classList.add('on');
    $('gate').classList.remove('open');
    applyMode(); checkNewFiles();
  }
  function onSignedOut() {
    user = null; pending.length = 0; renderChips();
    $('who').textContent = 'Signed out'; $('avatar').textContent = 'G'; $('dot').classList.remove('on'); $('newdot').style.display = 'none';
    $('files').classList.remove('open');
    applyMode(); openGate();
  }
  $('signout').addEventListener('click', () => sb && sb.auth.signOut());

  // ---- sending a message --------------------------------------------------------
  async function send(text, attachments) {
    busy = true; sendBtn.disabled = true;
    history.push({ role: 'user', content: text, attachments });
    saveHistory(); render();
    const wait = add('bot', ''); wait.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    const payload = history.map(m => ({ role: m.role, content: m.content, attachments: (m.attachments || []).map(a => a.path) }));
    try {   // mode buttons are locked while busy, so `mode` can't change mid-request
      const { ok, status, data } = await api('/api/chat', { method: 'POST', body: JSON.stringify({ messages: payload, mode }) });
      wait.remove();
      if (status === 401) { history.pop(); saveHistory(); await sb.auth.signOut(); return; }
      if (!ok) throw new Error(data.error || 'Request failed (' + status + ')');
      const made = data.files || [];
      history.push({ role: 'assistant', content: data.reply, made });
      saveHistory(); render();
      if (made.length) $('newdot').style.display = 'inline-block';
    } catch (e) {
      wait.remove(); add('err', e.message);
    } finally {
      busy = false; sendBtn.disabled = false; input.focus();
    }
  }

  $('chat').addEventListener('submit', (e) => {
    e.preventDefault();
    const typed = input.value.trim();
    const ready = pending.filter(f => f.status === 'ready');
    if ((!typed && !ready.length) || busy || !user) return;
    if (pending.some(f => f.status === 'uploading')) { add('err', 'Still uploading. Patience.'); return; }
    input.value = ''; input.style.height = 'auto';
    const attachments = ready.map(f => ({ path: f.path, name: f.name }));
    pending.length = 0; renderChips();
    send(typed || 'Have a look at the attached file(s).', attachments);
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('chat').requestSubmit(); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
  $('clear').addEventListener('click', () => {
    if (busy) return;
    if (history.length && !confirm('Start a new chat? This replaces the saved ' + mode + ' conversation.')) return;
    history = []; saveHistory(); render(); document.body.classList.remove('nav-open'); input.focus();
  });

  // ---- uploads: browser -> Supabase Storage, no server in between -------------------
  function renderChips() {
    const box = $('chips'); box.textContent = ''; box.classList.toggle('has', pending.length > 0);
    pending.forEach((f) => {
      const chip = document.createElement('div'); chip.className = 'chip' + (f.status === 'uploading' ? ' uploading' : '');
      const n = document.createElement('span'); n.className = 'n'; n.textContent = f.name;
      const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.title = 'Remove';
      x.addEventListener('click', () => { pending.splice(pending.indexOf(f), 1); renderChips(); });
      chip.append(n, x); box.appendChild(chip);
    });
  }

  async function uploadFile(file) {
    if (!user) return openGate();
    const dot = file.name.lastIndexOf('.');
    const ext = dot < 0 ? '' : file.name.slice(dot).toLowerCase();
    if (!ALLOWED.has(ext)) { add('err', file.name + ': that file type isn\'t supported.'); return; }
    if (file.size > MAX_UPLOAD) { add('err', file.name + ' is over 25 MB.'); return; }
    if (!file.size) { add('err', file.name + ' is empty.'); return; }
    const stem = file.name.slice(0, dot).replace(/[^A-Za-z0-9._-]/g, '_').replace(/^[._]+/, '').slice(0, 80) || 'file';
    const path = user.id + '/uploads/' + Date.now().toString(36) + '-' + stem + ext;
    const item = { name: file.name, path, status: 'uploading' };
    pending.push(item); renderChips();
    const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
    if (error) { pending.splice(pending.indexOf(item), 1); add('err', file.name + ': ' + error.message); }
    else item.status = 'ready';
    renderChips();
  }

  $('attach').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', (e) => { [...e.target.files].forEach(uploadFile); e.target.value = ''; });
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    [...(e.dataTransfer ? e.dataTransfer.files : [])].forEach(uploadFile);
  });

  // ---- files panel: list / download / delete (straight from Supabase Storage) ----------
  async function listFolder(folder) {
    const { data, error } = await sb.storage.from(BUCKET).list(user.id + '/' + folder, { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });
    if (error) throw error;
    return (data || []).filter(o => o.id).map(o => ({
      folder, name: o.name, path: user.id + '/' + folder + '/' + o.name,
      size: (o.metadata && o.metadata.size) || 0, created: o.created_at ? Date.parse(o.created_at) : 0,
    }));
  }

  async function checkNewFiles() {
    if (!user) return;
    try {
      const gen = await listFolder('generated');
      const seen = Number(localStorage.getItem(seenKey()) || 0);
      $('newdot').style.display = gen.some(f => f.created > seen) ? 'inline-block' : 'none';
    } catch {}
  }

  async function downloadFile(f) {
    const { data, error } = await sb.storage.from(BUCKET).download(f.path);
    if (error) { add('err', niceName(f.name) + ': ' + error.message); return; }
    const url = URL.createObjectURL(data);
    const a = document.createElement('a'); a.href = url; a.download = niceName(f.name);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  async function removeFile(f) {
    if (!confirm('Delete ' + niceName(f.name) + '?')) return;
    const { error } = await sb.storage.from(BUCKET).remove([f.path]);
    if (error) add('err', niceName(f.name) + ': ' + error.message);
    openFiles();
  }

  async function openFiles() {
    if (!user) return openGate();
    const list = $('fileList');
    $('files').classList.add('open');
    list.textContent = 'Loading…';
    let groups;
    try { groups = [['Made by Glitch', await listFolder('generated')], ['Your uploads', await listFolder('uploads')]]; }
    catch (e) { list.textContent = 'Could not load files: ' + e.message; return; }
    list.textContent = '';
    groups.forEach(([title, files]) => {
      const h = document.createElement('h3'); h.textContent = title; list.appendChild(h);
      if (!files.length) { const n = document.createElement('div'); n.className = 'none'; n.textContent = title === 'Made by Glitch' ? 'Nothing yet. Ask me to write some code.' : 'Nothing uploaded yet.'; list.appendChild(n); }
      files.forEach((f) => {
        const row = document.createElement('div'); row.className = 'frow';
        const name = document.createElement('div'); name.className = 'fn'; name.textContent = niceName(f.name);
        const meta = document.createElement('div'); meta.className = 'fm'; meta.textContent = fmtSize(f.size);
        const dl = document.createElement('button'); dl.type = 'button'; dl.className = 'mini'; dl.textContent = 'download';
        dl.addEventListener('click', () => downloadFile(f));
        const del = document.createElement('button'); del.type = 'button'; del.className = 'mini'; del.textContent = 'delete'; del.setAttribute('aria-label', 'Delete ' + niceName(f.name));
        del.addEventListener('click', () => removeFile(f));
        row.append(name, meta, dl, del); list.appendChild(row);
      });
    });
    const gen = groups[0][1];
    try { localStorage.setItem(seenKey(), String(Math.max(0, ...gen.map(f => f.created)))); } catch {}
    $('newdot').style.display = 'none';
  }
  $('filesBtn').addEventListener('click', openFiles);
  $('filesClose').addEventListener('click', () => $('files').classList.remove('open'));
  $('files').addEventListener('click', (e) => { if (e.target === $('files')) $('files').classList.remove('open'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('files').classList.remove('open'); });

  // ---- modes ------------------------------------------------------------------
  function applyMode() {
    document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    loadHistory(); render();
  }
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    if (busy || b.dataset.mode === mode) return;
    mode = b.dataset.mode;
    try { localStorage.setItem(MODE_KEY, mode); } catch {}
    applyMode();
  }));

  // ---- look & feel: accent, light/dark, mobile menu, suggestions, send ripple ----------
  const root = document.documentElement;
  const markTheme = () => document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.theme === root.dataset.theme));
  document.querySelectorAll('.swatch').forEach(s => s.addEventListener('click', () => {
    root.dataset.theme = s.dataset.theme; try { localStorage.setItem('glitch_theme', s.dataset.theme); } catch {} markTheme();
  }));
  markTheme();
  $('scheme').addEventListener('click', () => {
    const dark = root.dataset.scheme ? root.dataset.scheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.scheme = dark ? 'light' : 'dark'; try { localStorage.setItem('glitch_scheme', root.dataset.scheme); } catch {}
  });
  $('menu').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('side').addEventListener('click', (e) => { if (e.target.closest('[data-mode],#filesBtn')) document.body.classList.remove('nav-open'); });
  document.addEventListener('click', (e) => { if (document.body.classList.contains('nav-open') && !e.target.closest('#side,#menu')) document.body.classList.remove('nav-open'); });
  document.querySelectorAll('.suggest button').forEach(b => b.addEventListener('click', () => {
    if (b.hasAttribute('data-attach')) return $('fileInput').click();
    input.value = b.dataset.prompt; input.focus();
  }));
  sendBtn.addEventListener('click', (e) => {
    const r = sendBtn.getBoundingClientRect(), d = Math.max(r.width, r.height), s = document.createElement('span');
    s.className = 'ripple'; s.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
    sendBtn.appendChild(s); setTimeout(() => s.remove(), 600);
  });

  // ---- start ----------------------------------------------------------------------
  applyMode();
  let cfg = null;
  try { cfg = await (await fetch('/api/config')).json(); } catch {}
  if (!cfg) return openGate("Can't reach the server.");
  if (!cfg.configured) return openGate("Not set up yet. Missing on the server: " + cfg.missing.join(', '));
  if (!cfg.cognition) { const b = document.querySelector('[data-mode="cognition"]'); b.classList.add('off'); b.title += ' (not configured on the server)'; }
  if (!cfg.flash) { const b = document.querySelector('[data-mode="flash"]'); b.classList.add('off'); b.title += ' (not configured on the server)'; }

  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange((event, session) => {
    // Never await Supabase calls inside this callback (it can deadlock the client); just update the UI.
    if (session && session.user) { if (!user || user.id !== session.user.id) onSignedIn(session.user); }
    else if (event === 'SIGNED_OUT') onSignedOut();
  });
  const { data } = await sb.auth.getSession();
  if (!data.session) openGate();
})();
</script>
</body>
</html>
